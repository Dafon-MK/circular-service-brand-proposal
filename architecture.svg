<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif" font-size="13" role="img" aria-label="循環服務歸大豐，zero zero 是 C 類面對民眾的那張臉">
  <rect width="760" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b8b6ae"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">循環服務歸大豐，zero zero 是 C 類面對民眾的那張臉</text>

  <rect x="24" y="48" width="712" height="60" rx="8" fill="#e3edf9" stroke="#2f6fd6" stroke-width="2"/>
  <text x="380" y="74" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1f">大豐環保｜循環管理公司</text>
  <text x="380" y="96" text-anchor="middle" font-size="12.5" fill="#5f5f5f">業務開發、提案、合約、官網類別頁都用大豐</text>

  <g fill="none" stroke="#b8b6ae" stroke-width="1.25">
    <path d="M380 108V124"/>
    <path d="M107 124H653"/>
    <path d="M107 124V148"/><path d="M289 124V148"/><path d="M471 124V148"/><path d="M653 124V148"/>
  </g>

  <rect x="24" y="148" width="166" height="64" rx="8" fill="none" stroke="#b8b6ae" stroke-width="1.25"/>
  <text x="107" y="174" text-anchor="middle" font-weight="600" fill="#1f1f1f">A 廢棄物清運</text>
  <text x="107" y="196" text-anchor="middle" font-size="11.5" fill="#5f5f5f">要合法處理掉</text>

  <rect x="206" y="148" width="166" height="64" rx="8" fill="none" stroke="#b8b6ae" stroke-width="1.25"/>
  <text x="289" y="174" text-anchor="middle" font-weight="600" fill="#1f1f1f">B 再生塑膠粒</text>
  <text x="289" y="196" text-anchor="middle" font-size="11.5" fill="#5f5f5f">要買再生料</text>

  <rect x="388" y="148" width="166" height="64" rx="8" fill="#e3edf9" stroke="#2f6fd6" stroke-width="2"/>
  <text x="471" y="174" text-anchor="middle" font-weight="600" fill="#1f1f1f">C 循環服務</text>
  <text x="471" y="196" text-anchor="middle" font-size="11.5" fill="#1f1f1f">讓員工、顧客看到循環</text>

  <rect x="570" y="148" width="166" height="64" rx="8" fill="none" stroke="#b8b6ae" stroke-width="1.25"/>
  <text x="653" y="174" text-anchor="middle" font-weight="600" fill="#1f1f1f">D AI 分選與回收系統</text>
  <text x="653" y="196" text-anchor="middle" font-size="11.5" fill="#5f5f5f">政府導入回收系統</text>

  <g fill="none" stroke="#b8b6ae" stroke-width="1.25">
    <path d="M107 212V232H431V214" marker-end="url(#arrow)"/>
    <path d="M289 212V232"/>
    <path d="M501 212V266" marker-end="url(#arrow)"/>
  </g>
  <text x="107" y="252" font-size="11.5" fill="#5f5f5f">A、B 的實績是 C 的背書：真的回收、真的再生</text>

  <rect x="388" y="268" width="348" height="88" rx="8" fill="#fbe9e2" stroke="#e0703f" stroke-width="1.25"/>
  <text x="404" y="294" font-size="15" font-weight="600" fill="#1f1f1f">zero zero by 大豐環保</text>
  <text x="404" y="318" fill="#1f1f1f">C 類面對員工與民眾的呈現</text>
  <text x="404" y="340" font-size="12.5" fill="#5f5f5f">活動現場、再生產品標示、生活化社群</text>
</svg>
